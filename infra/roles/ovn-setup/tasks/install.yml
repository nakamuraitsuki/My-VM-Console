---
# https://docs.ovn.org/en/latest/intro/install/distributions.html#debian
# ちょっと古いけど、一応参考にする

# ovs に依存がある
- name: install OVS
  ansible.builtin.apt:
    name: openvswitch-switch
    update_cache: yes
    state: present

- name: install OVN
  ansible.builtin.apt:
    name:
      - ovn-central
      - ovn-host
      - ovn-common
    update_cache: yes
    state: present

- name: Ensure OVN and OVS services are enabled and started
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - openvswitch-switch
    - ovn-central
    - ovn-host