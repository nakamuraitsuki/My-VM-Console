---
- name: Create Nginx VPC proxy configuration
  ansible.builtin.template:
    src: vpc-proxy.conf.j2
    dest: /etc/nginx/sites-available/vpc-proxy.conf
  notify: Reload Nginx

- name: Enable VPC proxy site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/vpc-proxy.conf
    dest: /etc/nginx/sites-enabled/vpc-proxy.conf
    state: link