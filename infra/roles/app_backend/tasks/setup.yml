---
- name: Install minimal runtime tools
  ansible.builtin.apt:
    name: [rsync, curl, ca-certificates]
    state: present

- name: Ensure working directory exists
  ansible.builtin.file:
    path: "{{ app_root }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
    
- name: Create app config directory
  ansible.builtin.file:
    path: "/etc/{{ backend_app_name }}"
    state: directory
    mode: '0755'

- name: Copy backend config file
  ansible.builtin.template:
    src: "backend.conf.j2"
    dest: "{{ app_env_file }}"
    mode: '0600'
  notify: Restart backend service

- name: Copy identity mapping JSON
  ansible.builtin.copy:
    src: "external_auth_perm.json"
    dest: "{{ external_auth_perm_file }}"
    mode: '0644'