---
# cf. https://coredns.io/
coredns_version: "1.14.2"
# vars ファイル等
coredns_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
coredns_download_url: "https://github.com/coredns/coredns/releases/download/v{{ coredns_version }}/coredns_{{ coredns_version }}_linux_{{ coredns_arch }}.tgz"
coredns_config_dir: "/etc/coredns"
coredns_bin_dir: "/usr/local/bin"

internal_domain: "{{ cloud_domain }}."
etcd_endpoint: "http://localhost:2379"