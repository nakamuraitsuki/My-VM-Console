---
# ホストにFRRをインストール
- name: Install FRR on Host
  become: true
  ansible.builtin.apt:
    name: frr
    state: present
    update_cache: yes 

# FRRのデーモン設定（BGPとZebraを有効化）
- name: Enable BGP and Zebra daemons on Host
  become: true
  ansible.builtin.lineinfile:
    path: /etc/frr/daemons
    regexp: "^{{ item }}=no"
    line: "{{ item }}=yes"
  loop:
    - bgpd
    - zebra

# ホストのIPフォワーディングを有効化（VPCへのルーティングに必要）
# ssh の方でやっているが、Roleとして単体で完結させるためにここでも設定する
- name: Enable IPv4 forwarding on Host
  become: true
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: yes
    state: present
    reload: yes

# FRR設定ファイルの配置
- name: Deploy FRR config to Host
  become: true
  ansible.builtin.template:
    src: frr-host.conf.j2
    dest: /etc/frr/frr.conf
    owner: frr
    group: frr
    mode: '0640'

# FRRサービス再起動
- name: Restart FRR on Host
  become: true
  ansible.builtin.systemd:
    name: frr
    state: restarted
    enabled: yes